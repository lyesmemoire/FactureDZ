[package]
name = "facturation-dz"
version = "1.0.0"
description = "FacturationDZ — Logiciel de facturation professionnel hors ligne pour entreprises algériennes"
authors = ["FacturationDZ"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "facturation_dz_lib"
crate-type = ["rlib"]  # application de bureau uniquement ; cdylib/staticlib retirés : limite d'exports DLL Windows dépassée (ordinal > 65535).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
dirs = "5"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"] }
sha2 = "0.10"
base64 = "0.22"
printpdf = "0.3"
log = { version = "0.4", features = ["std"] }
calamine = { version = "0.30", default-features = false, features = ["dates"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
